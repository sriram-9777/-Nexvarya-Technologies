<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const theme = localStorage.getItem('nexvarya_theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.add(theme);
        document.documentElement.lang = localStorage.getItem('nexvarya_lang') === 'te' ? 'te' : 'en';
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="icon" type="image/png" href="/nexvarya_brand_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexvarya Technologies - Multi-Business Platform</title>
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
